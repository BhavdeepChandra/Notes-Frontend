name: Deploy Notes-Frontend
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - uses: actions/checkout@v7

      # Debugging Step: This will verify if secrets are present.
      # Note: The values will be masked as *** in your logs.
      - name: Debug Secret Injection
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "::error::PROVIDER secret is EMPTY."
          else
            echo "PROVIDER secret is injected."
          fi
          if [ -z "${{ secrets.GCP_SA_EMAIL }}" ]; then
            echo "::error::SA_EMAIL secret is EMPTY."
          else
            echo "SA_EMAIL secret is injected."
          fi

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'

      - name: Build Application
        run: |
          npm install
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.GCP_SA_EMAIL }}'
          projectId: 'crypto-isotope-499819-r7'